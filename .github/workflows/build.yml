name: build
on:
  push:
    branches: [main]
  pull_request:
env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate build tag
        id: tag
        run: echo "value=main-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ Image built and pushed"
          echo "✅ Tag: ${{ steps.tag.outputs.value }}"
          echo "🚀 ${{ env.REGISTRY }}/${{ env.IMAGE }}"
          echo "### ✅ Build complete" >> $GITHUB_STEP_SUMMARY
          echo "Pushed \`${{ steps.tag.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
